version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nba_postgres
    environment:
      POSTGRES_USER: nba_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: nba_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: nba_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: nba_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nba_user:secret_password@db:5432/nba_db
      - REDIS_URL=redis://redis:6379/0
      - BALLDONTLIE_API_KEY=${BALLDONTLIE_API_KEY} # Sender nøglen fra din .env ind i containeren
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - redis

volumes:
  pgdata: